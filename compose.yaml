# Step 9: the CPU serving stack as three containers, one command.
#
#   docker compose up -d --build        # start (builds the gateway image)
#   docker compose ps                   # all three should say (healthy)
#   docker compose logs -f gateway      # follow one service's logs
#   docker compose down                 # stop and remove
#
#   client ──► gateway :9000 ──► llamacpp :8080
#                  └───────────► redis :6379
#
# Containers find each other BY SERVICE NAME (Docker's built-in DNS): the gateway calls
# http://llamacpp:8080, not localhost. Only the gateway is published to the outside;
# llama.cpp's port is published on 127.0.0.1 only, for debugging and /metrics.
#
# Settings (env vars or a .env file next to this file):
#   QUANT=fp16|q8_0|q4_k_m   NP=8 (slots)   CTX_SIZE=NP x 2048 (16384)   THREADS=2
#   MAX_INFLIGHT=8 MAX_QUEUE=8 QUEUE_TIMEOUT_S=6   CACHE_TTL_S=3600

name: llm-serving

services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      -m /models/qwen2.5-0.5b-instruct-${QUANT:-fp16}.gguf
      --host 0.0.0.0 --port 8080
      --parallel ${NP:-8} --ctx-size ${CTX_SIZE:-16384} --cont-batching
      --threads ${THREADS:-2} --threads-batch ${THREADS:-2}
      --jinja --metrics
    volumes:
      - ./models:/models:ro             # model file comes from the host, read-only (not baked into the image)
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:                        # /health is 200 only once the model is loaded (503 while loading)
      # Speak HTTP with bash's built-in /dev/tcp (healthy = status line has " 200 "). A curl-based check kept
      # seeing 503 here while this one saw 200 within seconds; cause unconfirmed (no proxy vars in the container).
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200 "']
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s                 # loading time: failures here don't count
    cpus: 2.0                           # = the 2 physical cores we measured with
    mem_limit: 2g                       # weights are mmap'd (~file size) + KV cache + ~260 MB
    restart: unless-stopped
    stop_grace_period: 30s              # let in-flight requests finish on shutdown

  redis:
    image: redis:7-alpine
    # A pure cache: no saving to disk; when full, evict the least-recently-used keys
    command: >
      redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
      --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 3
    mem_limit: 320m                     # maxmemory + Redis' own overhead
    restart: unless-stopped

  gateway:
    build: ./serving/gateway
    image: llm-gateway:latest
    environment:
      BACKEND_URL: http://llamacpp:8080
      BACKEND_READY_PATH: /health
      REDIS_URL: redis://redis:6379/0
      MAX_INFLIGHT: ${MAX_INFLIGHT:-8}
      MAX_QUEUE: ${MAX_QUEUE:-8}
      QUEUE_TIMEOUT_S: ${QUEUE_TIMEOUT_S:-6}
      CACHE_TTL_S: ${CACHE_TTL_S:-3600}
    ports:
      - "9000:9000"
    depends_on:
      llamacpp:
        condition: service_healthy      # don't start until the model is loaded
      redis:
        condition: service_started      # the gateway copes with Redis coming up later
    cpus: 0.5
    mem_limit: 256m
    ulimits:
      nofile: 65536                     # one socket per waiting client at 1000 users
    restart: unless-stopped
